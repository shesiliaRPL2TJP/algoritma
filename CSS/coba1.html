<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    /*Selector Elemen - semua tag <h2> */
    h2 {
      color:#5f7cbb;
      border-bottom: 2px solid #630f0f;
    }

    /* Selector Class - elemen yang punya class='highlight' */
    .highlight {
      background-color: yellow;
      font-weight: bold;
    }
    
    /* Selector ID - elemen dengan id='hero' */
    #hero {
    background-color:aqua;
      color: white
      pandding: 40px;
    }

    /* Grouping - terapkan gaya yang sama ke h1,h2,h3 */
    h1, h2, h3 {
      font-family: 'georgia', serif;
      color:#1A5276;
    }

    /* Pseudo-class tautan saat di-hover */
    a:hover {
      color:rgb(255, 0, 0)
      text-decoration: underline;
    }

    <style>
    </style>
</head>
<body>
    <h1>SELAMAT DATANG</h1>
    <h2>REKAYASA PERANGKAT LUNAK</h2>

    <a href:"#">X RPL</a>

    <p class="highlight">Andi Sukirno</p>

    <p id="hero">Bayu Kusuma</p>
</body>
</html>
